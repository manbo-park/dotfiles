# 프리픽스를 Ctrl+a로 변경
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 마우스 지원 활성화
set -g mouse on

# 윈도우 번호를 1부터 시작
set -g base-index 1
setw -g pane-base-index 1

# 윈도우를 닫으면 번호를 재정렬
set -g renumber-windows on

# 스크롤 버퍼 크기 늘리기
set -g history-limit 10000

# Escape 키 지연 제거 (Vim 사용자 필수)
set -sg escape-time 0

# 256 색상 지원
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 터미널 에뮬레이터(Ghostty 등)의 윈도우/탭 타이틀에 세션명을 표시
set -g set-titles on
set -g set-titles-string "#S / #W"

# 직관적인 분할 단축키
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 새 윈도우도 현재 디렉토리에서 열기
bind c new-window -c "#{pane_current_path}"

# Vim 스타일 패널 이동
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 프리픽스 없이 Alt+방향키로 패널 이동
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# 패널 크기 조절
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 셸이 윈도우 이름을 덮어쓰지 못하게 고정
set -g allow-rename off

# 색상 변수 정의 (이후 옵션에서 #{@이름} 으로 참조)
set -g @mio-1 "#dc1935"
set -g @mio-2 "#ff314a"
set -g @marine-1 "#a72413"
set -g @marine-2 "#ca3c28"
set -g @la+-1 "#441495"
set -g @la+-2 "#936cc6"
set -g @iroha-1 "#44bfb7"
set -g @iroha-2 "#93dcd8"
set -g @iroha-3 "#f2d8c0"
set -g @kanade-1 "#f6c663"
set -g @kanade-2 "#ffe7b5"

# 상태 표시줄 배경색·폰트 색상 설정
set -g status-style "bg=#{@iroha-2},fg=black"

# 상태 표시줄 길이 설정
set -g status-left-length 50

# 좌측 영역: 프리픽스 입력 대기 여부(client_prefix)에 따라 표시를 전환한다.
#   - 프리픽스 활성 → iroha-1 배경 + 흰 글자 " PREFIX "
#   - 평상시        → iroha-2 배경 + 검은 글자 " [세션명] "
# 백슬래시로 한 문자열을 여러 줄에 나눠 적되, 연속 줄을 들여쓰면 그 공백이
# 문자열에 포함되므로 각 줄은 반드시 열 0에서 시작한다.
set -g status-left "#{?client_prefix,\
#[bg=#{@iroha-1}]#[fg=white] PREFIX ,\
#[bg=#{@iroha-2}]#[fg=black] [#{session_name}] \
}"

# 윈도우 목록 형식: 활성·비활성 모두 앞 공백 1칸을 두어 형식을 맞춘다.
# (이렇게 해야 첫 윈도우의 활성 여부와 무관하게 세션명과 윈도우명 사이
#  간격이 일정하게 유지된다.)
set -g window-status-format         " #I:#W#{?window_flags,#F, }"
set -g window-status-current-format " #I:#W#{?window_flags,#F, }"

# 우측 영역 기본 배경색
set -g status-right-style "bg=#{@iroha-3},fg=black"

# 우측: yyyy-mm-dd HH:MM 형식
set -g status-right " %Y-%m-%d %a %H:%M "

# 명령 프롬프트/메시지 표시줄 색상
set -g message-style "bg=#{@iroha-3},fg=black"
set -g message-command-style "bg=#{@iroha-3},fg=black"

# 선택 모드(choose-tree: prefix+w, copy 모드 선택) 현재 항목 강조 색상
set -g mode-style "bg=#{@iroha-1},fg=white"

# 패널 경계선 색상
set -g pane-active-border-style "fg=#{@iroha-3}"

# 활성 패널 표시 방식
set -g pane-border-indicators off

# 패널 경계선
set -g pane-border-lines heavy

# 비활성 패널을 어둡게 디밍하여 활성 패널 강조
set -g window-style        "fg=colour240,bg=colour234"
set -g window-active-style "fg=terminal,bg=terminal"

# 설정 파일 다시 불러오기
bind r source-file ~/.config/tmux/tmux.conf \; display " 설정을 다시 불러왔습니다!"

# Copy 모드에서 vi 스타일 단축키 사용
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel