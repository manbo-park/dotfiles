# 프리픽스를 Ctrl+a로 변경
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 마우스 지원 활성화
set -g mouse on

# 윈도우 번호를 1부터 시작
set -g base-index 1
setw -g pane-base-index 1

# 윈도우를 닫으면 번호를 재정렬
set -g renumber-windows on

# 스크롤 버퍼 크기 늘리기
set -g history-limit 10000

# Escape 키 지연 제거 (Vim 사용자 필수)
set -sg escape-time 0

# 256 색상 지원
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 터미널 에뮬레이터(Ghostty 등)의 윈도우/탭 타이틀에 세션명을 표시
set -g set-titles on
set -g set-titles-string "#S / #W"

# 직관적인 분할 단축키
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 새 윈도우도 현재 디렉토리에서 열기
bind c new-window -c "#{pane_current_path}"

# Vim 스타일 패널 이동
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 프리픽스 없이 Alt+방향키로 패널 이동
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# 패널 크기 조절
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 셸이 윈도우 이름을 덮어쓰지 못하게 고정
set -g allow-rename off

# 색상 변수 정의 (이후 옵션에서 #{@이름} 으로 참조)
#set -g @om-1 "#dc1935"
#set -g @om-2 "#ff314a"
set -g @hm-1 "#a72413"
#set -g @hm-2 "#ca3c28"
set -g @ki-1 "#44bfb7"
set -g @ki-2 "#93dcd8"
set -g @ki-3 "#f2d8c0"
#set -g @ld-1 "#441495"
#set -g @ld-2 "#936cc6"
set -g @ok-1 "#f6c663"
#set -g @ok-2 "#ffe7b5"

# 상태 표시줄 배경색·폰트 색상 설정
set -g status-style "bg=#{@ki-2},fg=black"

# 상태 표시줄 길이 설정
set -g status-left-length 50

# 좌측 영역: 프리픽스 입력 대기 여부(client_prefix)에 따라 표시를 전환한다.
set -g status-left "#{?client_prefix,\
#[bg=#{@hm-1}]#[fg=white] PREFIX ,\
#[bg=#{@ki-1}] [#{session_name}] \
}"

# 윈도우 목록 형식: 활성·비활성 모두 앞 공백 1칸을 두어 형식을 맞춘다.
# (이렇게 해야 첫 윈도우의 활성 여부와 무관하게 세션명과 윈도우명 사이
#  간격이 일정하게 유지된다.)
set -g window-status-format         " #I:#W#{?window_flags,#F, }"
set -g window-status-current-format " #I:#W#{?window_flags,#F, }"

# 우측 영역 기본 배경색
set -g status-right-style "bg=#{@ki-3},fg=black"

# 현재 입력 언어
## im-select는 macOS 입력소스 전환 도구라 Linux/WSL에는 없다.
## WSL은 IME 상태가 Windows 호스트 쪽에 있어 tmux에서 조회할 방법이 없으므로,
## im-select가 있을 때만 KO/EN을 표시하고 없으면 조용히 생략한다.
set -g status-interval 1
set -g status-right "#[bg=#{@ok-1}] #(command -v im-select >/dev/null 2>&1 && im-select | sed -e 's/.*Korean/KO/' -e 's/.*ABC/EN/' -e 's/.*Japanese/JP/') #[bg=#{@ki-3}]#[fg=black] %Y-%m-%d %a %H:%M "

# 명령 프롬프트/메시지 표시줄 색상
set -g message-style "bg=#{@ki-3},fg=black"
set -g message-command-style "bg=#{@ki-3},fg=black"

# 선택 모드(choose-tree: prefix+w, copy 모드 선택) 현재 항목 강조 색상
set -g mode-style "bg=#{@ki-1},fg=white"

# 메뉴(prefix+< / prefix+>) 색상
set -g menu-style "bg=#{@ki-3},fg=black"
set -g menu-selected-style "bg=#{@ki-1},fg=white"
set -g menu-border-style "fg=#{@ki-2}"

# 패널 경계선 색상
set -g pane-active-border-style "fg=#{@ki-3}"

# 활성 패널 표시 방식
set -g pane-border-indicators off

# 패널 경계선
set -g pane-border-lines heavy

# 비활성 패널을 어둡게 디밍하여 활성 패널 강조
set -g window-style        "fg=colour240,bg=colour234"
set -g window-active-style "fg=terminal,bg=terminal"

# 패널 번호 색상 (prefix+q); 변수명 참조 지원하지 않음
set -g display-panes-active-colour "#93dcd8"
set -g display-panes-colour "#f2d8c0"

# 팝업 테두리 색상
set -g popup-border-style "fg=#{@ki-2}"

# <prefix> + p 키를 눌러 팝업 셸 실행
bind-key p display-popup -w 80% -h 80% -E "zsh"

# 설정 파일 다시 불러오기
bind r source-file ~/.config/tmux/tmux.conf \; display " 설정을 다시 불러왔습니다!"

# Copy 모드에서 vi 스타일 단축키 사용
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel